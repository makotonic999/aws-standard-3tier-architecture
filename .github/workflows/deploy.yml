name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main
      - 'feature/*'
    paths:
      - 'app/**' # Trigger only when files under the app directory change

permissions:
  id-token: write # Required for OIDC authentication
  contents: read  # Required to checkout the repository code

jobs:
  deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate with AWS using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # 3. Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build, Tag, and Push the Docker image to Amazon ECR
      - name: Build, Tag, and Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: standard-webapp
          IMAGE_TAG: latest
        run: |
          cd app
          # Build the Docker image for the target platform (ECS Fargate)
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          # Push the image to Amazon ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG